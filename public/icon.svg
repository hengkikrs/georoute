<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Route Line / Waypoint Path -->
  <path d="M140 370 C 140 280, 240 280, 260 220 C 275 175, 330 170, 360 210" 
        fill="none" stroke="#6ee7b7" stroke-width="14" stroke-dasharray="16 12" stroke-linecap="round" />

  <!-- Start Waypoint Circle -->
  <circle cx="140" cy="370" r="22" fill="#10b981" stroke="#ffffff" stroke-width="8" filter="url(#shadow)" />
  <circle cx="140" cy="370" r="8" fill="#ffffff" />

  <!-- Mid Waypoint Circle -->
  <circle cx="260" cy="220" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="6" />

  <!-- Main Destination Pin -->
  <g filter="url(#shadow)">
    <path d="M370 130 C325 130 290 165 290 210 C290 270 370 350 370 350 C370 350 450 270 450 210 C450 165 415 130 370 130 Z" 
          fill="url(#pinGrad)" stroke="#ffffff" stroke-width="8" />
    <circle cx="370" cy="205" r="28" fill="#ffffff" />
    <circle cx="370" cy="205" r="14" fill="#0284c7" />
  </g>
</svg>
